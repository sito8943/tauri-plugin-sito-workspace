[package]
name = "tauri-plugin-sito-workspace"
version = "0.3.0"
authors = ["Sito"]
description = "Typed workspace filesystem primitives for Sito desktop applications"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-sito-workspace"

[dependencies]
blake3 = "1"
ignore = "0.4"
regex = "1"
notify = "6"
trash = "5"
tauri = { version = "2.11.3" }
serde = { version = "1.0", features = ["derive"] }
tempfile = "3"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.6.3", features = ["build"] }
